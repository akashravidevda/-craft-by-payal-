<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px/1.6 system-ui;color:#21201E;background:#FBF7F1;padding:12px}button,input,select{font:inherit;max-width:100%;box-sizing:border-box;margin:6px 0;padding:9px}button{background:#D63F46;color:white;border:0;border-radius:10px;cursor:pointer}article{background:white;padding:12px;margin:12px 0;border-radius:12px}label{display:block}#message{white-space:pre-wrap}button:disabled{opacity:.6}</style></head><body><h2>Your studio</h2><p>Edit readable rows in Shop Products, Shop Variants and Shop Images. Set State to published, then validate and publish.</p><button id="publish">Validate &amp; publish</button><button id="refresh">Refresh orders</button><p id="message" role="status"></p><div id="orders"></div><script>
const message=document.querySelector('#message');
function report(error){message.textContent=error.message;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
function load(){google.script.run.withSuccessHandler(data=>{const root=document.querySelector('#orders');root.replaceChildren();data.orders.forEach(order=>{const article=document.createElement('article'),title=document.createElement('h3'),info=document.createElement('p');title.textContent=order.number+' · '+order.name;info.textContent='₹'+order.total.toLocaleString('en-IN')+' · '+order.payment+' · '+order.production;article.append(title,info);const label=document.createElement('label');label.textContent='Payment reference (verify receipt first)';const input=document.createElement('input');label.append(input);article.append(label);const paid=document.createElement('button');paid.textContent='Confirm payment received';paid.disabled=order.payment==='Verified paid';paid.onclick=()=>{if(!input.value.trim()){message.textContent='Enter the verified payment reference.';return;}paid.disabled=true;google.script.run.withSuccessHandler(()=>{message.textContent='Payment verified.';load();}).withFailureHandler(report).verifyOwnerPayment(order.id,input.value.trim());};article.append(paid);const select=document.createElement('select');select.setAttribute('aria-label','Production stage for '+order.number);['Awaiting photos','Designing','Awaiting approval','Handcrafting','Ready'].forEach(value=>{const option=document.createElement('option');option.value=option.textContent=value;select.append(option);});select.value=order.production;article.append(select);const update=document.createElement('button');update.textContent='Update production';update.onclick=()=>{update.disabled=true;google.script.run.withSuccessHandler(()=>{message.textContent='Production updated.';load();}).withFailureHandler(report).updateOwnerProduction(order.id,select.value);};article.append(update);root.append(article);});}).withFailureHandler(report).getOwnerOverview();}
document.querySelector('#refresh').onclick=load;document.querySelector('#publish').onclick=()=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(data=>{message.textContent=data.count+' products published.';document.querySelectorAll('button').forEach(b=>b.disabled=false);load();}).withFailureHandler(report).publishCatalogue();};load();
</script></body></html>
