<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share your photos</title><style>body{font:16px/1.6 system-ui;background:#FBF7F1;color:#21201E;padding:20px}main{max-width:480px;margin:auto;background:#fffdf9;padding:24px;border-radius:20px}label{display:block;margin:16px 0}input,button{font:inherit;max-width:100%}button{background:#D63F46;color:white;border:0;border-radius:24px;padding:12px 20px}button:disabled{opacity:.6}#message{white-space:pre-wrap}</style></head><body><main><h1>A personal touch</h1><p>Share one JPEG or PNG at a time, up to 5 MB. Your photos are private to the studio. Keep this order link private.</p><form id="upload"><input type="hidden" name="orderId"><input type="hidden" name="token"><input type="hidden" name="uploadId"><label>Your photo<input type="file" name="photo" accept="image/jpeg,image/png" required></label><button>Send photo</button></form><p id="message" role="status" aria-live="polite"></p><p>Keep your original photos until the studio confirms receipt.</p></main><script>
const form=document.querySelector('form'),message=document.querySelector('#message');let ready=false;
google.script.url.getLocation(loc=>{const q=new URLSearchParams(loc.hash||'');form.elements.orderId.value=q.get('orderId')||'';form.elements.token.value=q.get('token')||'';ready=!!form.elements.orderId.value&&!!form.elements.token.value;if(!ready){form.hidden=true;message.textContent='Open the private upload link from your order confirmation.';}});
form.elements.photo.addEventListener('change',()=>{form.elements.uploadId.value=crypto.randomUUID();});
form.addEventListener('submit',event=>{event.preventDefault();if(!ready)return;const file=form.elements.photo.files[0];if(!file||file.size>5242880||!['image/jpeg','image/png'].includes(file.type)){message.textContent='Choose a JPEG or PNG up to 5 MB.';return;}const button=form.querySelector('button');button.disabled=true;message.textContent='Sending your photo… Keep this page open.';google.script.run.withSuccessHandler(result=>{message.textContent=result.message;form.elements.photo.value='';form.elements.uploadId.value='';button.disabled=false;}).withFailureHandler(error=>{message.textContent=error.message;button.disabled=false;}).submitOrderPhoto(form);});
</script></body></html>
